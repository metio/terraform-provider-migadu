name: Automated Release
on:
  schedule:
    - cron: 35 4 * * THU
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_count: ${{ steps.commits.outputs.count }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: last_release
        name: Fetch Last Release
        run: echo "tag=$(gh release view --json tagName --jq '.tagName')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: commits
        name: Count Commits
        run: echo "count=$(git rev-list --count "${LAST_RELEASE}..HEAD")" >> "$GITHUB_OUTPUT"
        env:
          LAST_RELEASE: ${{ steps.last_release.outputs.tag }}
      - id: release
        name: Create Release Version
        if: steps.commits.outputs.count > 0
        run: echo "version=$(date +'%Y.%-m.%-d')" >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    if: needs.prepare.outputs.commit_count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: 386
          - goos: freebsd
            goarch: arm
          - goos: freebsd
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: 386
          - goos: windows
            goarch: arm
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm
          - goos: darwin
            goarch: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.release_version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: toolchain
        name: Set up Toolchain
        uses: metio/breto@7bcd096b907a92d210885216dc2bcb9918612078 # 2026.10.31161821
        with:
          registries: github:metio/toolchains
      - id: build
        name: Build Provider
        run: |
          binary="terraform-provider-migadu_v${VERSION}"
          if [ "$GOOS" = windows ]; then binary="$binary.exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" -o "$binary"
          zip "terraform-provider-migadu_${VERSION}_${GOOS}_${GOARCH}.zip" "$binary" LICENSE README.md
        env:
          CGO_ENABLED: 0
      - id: upload
        name: Upload Archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-provider-migadu-${{ matrix.goos }}-${{ matrix.goarch }}
          path: terraform-provider-migadu_${{ needs.prepare.outputs.release_version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
  release:
    name: GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.release_version }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: download
        name: Download Archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: terraform-provider-migadu-*
          merge-multiple: true
      - id: checksums
        name: Calculate Checksums
        run: |
          cp terraform-registry-manifest.json "dist/terraform-provider-migadu_${VERSION}_manifest.json"
          cd dist
          sha256sum -- *.zip "terraform-provider-migadu_${VERSION}_manifest.json" > "terraform-provider-migadu_${VERSION}_SHA256SUMS"
      # The Terraform Registry only accepts a GPG signature of the checksums.
      - id: sign
        name: Sign Checksums
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir --mode=700 "$GNUPGHOME"
          printf '%s' "$GPG_SECRET_KEY_BASE64" | base64 --decode | gpg --batch --import
          printf '%s' "$GPG_SECRET_KEY_PASSWORD" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --output "dist/terraform-provider-migadu_${VERSION}_SHA256SUMS.sig" --detach-sign "dist/terraform-provider-migadu_${VERSION}_SHA256SUMS"
        env:
          GPG_SECRET_KEY_BASE64: ${{ secrets.GPG_SECRET_KEY_BASE64 }}
          GPG_SECRET_KEY_PASSWORD: ${{ secrets.GPG_SECRET_KEY_PASSWORD }}
      - id: create_release
        name: Create Release
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
